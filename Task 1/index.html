<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Card Row</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>My Projects</h1>

<div class="cards">

    <div class="card">
        <img src="got.jpg" alt="Project image">
        <div class="content">
            <h2>Game of Thrones</h2>
            <p>Gold edition.</p>
            <button>Read More</button>
        </div>
    </div>

    <div class="card">
        <img src="hp.jpg" alt="Project image">
        <div class="content">
            <h2>Harry Potter</h2>
            <p>Exclusive edition.</p>
            <button>Read More</button>
        </div>
    </div>

    <div class="card">
        <img src="thg.jpg" alt="Project image">
        <div class="content">
            <h2>The Hunger Games</h2>
            <p>Rare collection.</p>
            <button>Read More</button>
        </div>
    </div>

</div>

</body>
</html>
